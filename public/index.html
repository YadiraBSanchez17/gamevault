<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameVault</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🎮 GameVault</h1>
        <p>Tu colección personal de videojuegos</p>
    </header>

    <main>

        <section class="formulario">

            <h2>Agregar videojuego</h2>

            <form id="gameForm">

                <input
                    type="text"
                    id="nombre"
                    placeholder="Nombre del videojuego"
                    required
                >

                <input
                    type="text"
                    id="genero"
                    placeholder="Género"
                    required
                >

                <input
                    type="text"
                    id="plataforma"
                    placeholder="Plataforma"
                    required
                >

                <select id="estado">
                    <option>Jugando</option>
                    <option>Completado</option>
                    <option>Pendiente</option>
                </select>

                <button type="submit">
                    Guardar juego
                </button>

            </form>

        </section>

        <section>

            <h2>Mi colección</h2>

            <div id="gamesContainer">

            </div>

        </section>

    </main>

    <script src="app.js"></script>

</body>
</html>
